site_name: Data and Research Center
site_url: https://dataresearchcenter.org
site_description: The Data and Research Center is an independent organization providing bespoke data and research services for investigative teams.

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Neg.svg
  favicon: https://cdn.investigativedata.org/style/logos/darc/favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.follow
    # - content.code.copy
    - header.autohide
  palette:
    scheme: slate
  icon:
    menu: material/menu
    search: material/magnify

extra:
  logo_light: https://cdn.investigativedata.org/style/logos/darc/svg/DARC-Logo-RGB-Horizontal-Pos.svg
  social:
    - icon: material/mail
      link: mailto:hi@dataresearchcenter.org
    - icon: material/web
      link: https://dataresearchcenter.org
    - icon: material/github
      link: https://github.com/dataresearchcenter

extra_css:
  - https://dataresearchcenter.github.io/zensical-theme-darc/stylesheets/darc-zensical.css
  - stylesheets/tokens.css
  - stylesheets/components.css
  - stylesheets/site.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/scroll-color.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # String references resolve to Zensical's bundled icon-aware
  # to_svg/twemoji helpers (zensical/config.py:453-457) – these scan
  # `templates/.icons/{lucide,material,simple,octicons,fontawesome}/`
  # so `:lucide-x:` / `:material-x:` / `:simple-x:` / `:octicons-x:` /
  # `:fontawesome-...:` shortcodes render as inline SVG.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - meta
  - blog:
      post_url_date_format: yyyy
      blog_toc: false
      post_excerpt: required
  - search
  # `cache: false` is deliberate: with a warm cache the optimize plugin's
  # worker rewrites a file's src_path to its .cache path before the main
  # thread removes it from the Files collection, intermittently crashing the
  # build ("... not in collection"). Disabling the cache keeps every job doing
  # real (slower) work, so removal always wins the race.
  - optimize:
      cache: false
      enabled: !ENV [CI, false]
  # Map legacy (pre-migration) blog URLs → the new blog-plugin posts.
  # Values are the post src paths; the redirects plugin resolves each to the
  # post's current URL. Generated by build.py (rerun it if articles change).
  - redirects:
      redirect_maps:
        "blog/2026/01/Our-Work-on-The-Damascus-Dossier/f891f334-c78a-46eb-8f1d-0909acbc92c4.md": "blog/posts/2026-01-15-our-work-on-the-damascus-dossier.md"
        "blog/2025/07/Why-We-Run-Our-Own-Servers-(And-Why-That-Matters-for-You)/02285437-436f-460c-921a-4b40342fb026.md": "blog/posts/2025-07-15-why-we-run-our-own-servers-and-why-that-matters-for-you.md"
        "blog/2025/04/Road-Trippin'-with-DARC/0504bd46-d8d7-4b98-b0b5-4ae4741dc841.md": "blog/posts/2025-04-18-road-trippin-with-darc.md"
        "blog/2025/03/Introducing-DARC:-The-Future-of-Investigative-Research-and-Data-Solutions/e862307a-e635-4101-9ad0-88b3fa51c0f9.md": "blog/posts/2025-03-31-introducing-darc-the-future-of-investigative-research-and-data-solutions.md"

# Authoring aids (reference.md, typography.md) stay as files but out of the nav.
not_in_nav: |
  index.md
  reference.md
  typography.md

nav:
  - What we do: what-we-do.md
  - Who we are: who-we-are.md
  - Projects: projects.md
  - Blog: blog/index.md
  - Contact: contact.md
