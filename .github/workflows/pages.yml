name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs-material
      - run: mkdocs build

      # Compile the DARC design system into ONE css that downstream mkdocs
      # sites can consume via a single extra_css URL. The upstream base
      # (darc-zensical.css) is fetched fresh from zensical-theme-darc — we keep
      # no local copy — then the project layers (tokens/components/site) are
      # appended in cascade order. No @import and all url() are absolute, so
      # plain concatenation is safe. Site-specific extra.css is intentionally
      # left out — each downstream site keeps its own.
      - name: Bundle design-system CSS
        run: |
          out=site/darc.css
          {
            echo "/* darc.css — compiled DARC design system for downstream mkdocs sites."
            echo "   Auto-generated from docs/stylesheets/ by .github/workflows/pages.yml."
            echo "   Consume with a single entry, then add your own overrides last:"
            echo "     extra_css:"
            echo "       - https://dataresearchcenter.github.io/darc-zensical-page/darc.css"
            echo "       - stylesheets/extra.css */"
            printf '\n/* ===== darc-zensical.css (fetched from upstream) ===== */\n'
            curl -fsSL https://dataresearchcenter.github.io/zensical-theme-darc/stylesheets/darc-zensical.css
            for f in tokens components site; do
              printf '\n/* ===== %s.css ===== */\n' "$f"
              cat "docs/stylesheets/$f.css"
            done
          } > "$out"
          echo "Wrote $out ($(wc -c < "$out") bytes)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
