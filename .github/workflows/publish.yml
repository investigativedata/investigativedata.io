name: Build and publish website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  publish:
    environment:
      name: dataresearchcenter.org
      url: https://dataresearchcenter.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # pngquant: system binary the optimize plugin shells out to for PNG (not
      # pip-installable). Optimize runs in CI (GitHub sets CI=true); Pillow for
      # JPG comes via mkdocs-material[imaging] in requirements.txt.
      - run: sudo apt-get update && sudo apt-get install -y pngquant
      - run: mkdocs build
      - run: make publish
        env:
          PUTFS_API_KEY: ${{ secrets.PUTFS_API_KEY }}
          PUTFS_API_SECRET: ${{ secrets.PUTFS_API_SECRET }}
